        const advancedOpen = localStorage.getItem('ui-advanced-search-open') === '1';
        if (advancedOpen) document.getElementById('filter-toggle').click();

        async function readApiJson(response, apiName) {
            // 旧版 Flask 进程没有新接口时会返回 HTML 404，不能直接按 JSON 解析。
            const text = await response.text();
            let payload;
            try {
                payload = JSON.parse(text);
            } catch (_) {
                const looksLikeHtml = /^\s*<!doctype|^\s*<html/i.test(text);
                if (looksLikeHtml && response.status === 404) {
                    throw new Error(`当前后端尚未加载${apiName}，请关闭正在运行的 app.py 后重新启动`);
                }
                throw new Error(`${apiName}返回了无法解析的内容（HTTP ${response.status}）`);
            }
            if (!response.ok && !payload.error) {
                throw new Error(`${apiName}请求失败（HTTP ${response.status}）`);
            }
            return payload;
        }

        /* ==================== 多选元件批量更新立创内容 ==================== */
        const batchSearchButton = document.getElementById('batch-search-lcsc');
        const batchApplyButton = document.getElementById('batch-apply-lcsc');
        const batchPreview = document.getElementById('batch-lcsc-preview');

        document.getElementById('batch-select-visible').addEventListener('click', () => {
            // “全选”针对当前筛选结果，包括尚未滚动渲染出的卡片。
            for (const { key } of filteredComponents) batchSelectedComponents.add(key);
            list.querySelectorAll('.comp-card').forEach(card => {
                card.classList.add('batch-selected');
                const checkbox = card.querySelector('[data-batch-select]');
                if (checkbox) checkbox.checked = true;
            });
            invalidateBatchLcscResults();
        });
        document.getElementById('batch-clear-selection').addEventListener('click', () => {
            batchSelectedComponents.clear();
            list.querySelectorAll('.comp-card').forEach(card => {
                card.classList.remove('batch-selected');
                const checkbox = card.querySelector('[data-batch-select]');
                if (checkbox) checkbox.checked = false;
            });
            invalidateBatchLcscResults();
        });
        batchSearchButton.addEventListener('click', async () => {
            const names = [...batchSelectedComponents];
            if (!names.length) return alert('请先勾选要搜索的元件');
            batchSearchRunning = true;
            batchSearchButton.textContent = `正在搜索 0/${names.length}…`;
            batchLcscResults = []; batchPreview.innerHTML = ''; batchPreview.classList.add('show'); syncBatchSelectionUi();
            try {
                // 逐项复用录入区相同的单项接口和 parameter 查询，避免并发反爬状态互相干扰。
                const productCache = new Map();
                for (let index = 0; index < names.length; index++) {
                    const name = names[index];
                    const component = allComponents[name] || {};
                    const query = String(component.parameter || component.lcsc_code || '').trim();
                    let product;
                    if (!query) {
                        product = { success: false, error: '元件没有可搜索的参数' };
                    } else if (productCache.has(query)) {
                        // 多个实体货位使用相同参数时复用首次结果，不重复访问立创。
                        product = productCache.get(query);
                    } else {
                        try {
                            product = await fetch(api('/api/crawl_lcsc') + '&keyword=' + encodeURIComponent(query))
                                .then(response => readApiJson(response, '立创搜索接口'));
                        } catch (error) {
                            product = { success: false, error: error.message };
                        }
                        productCache.set(query, product);
                    }
                    const item = { component_name: name, query, product };
                    batchLcscResults.push(item);
                    const productResult = item.product || {};
                    const image = safeImageUrl(productResult.image);
                    let resultHtml;
                    if (productResult.success) {
                        resultHtml = `<div class="batch-result ok">
                            ${image ? `<img src="${escapeHtml(image)}" alt="商品图片">` : ''}
                            <span title="${escapeHtml(productResult.product_name || '')}">${escapeHtml(item.component_name)} · ${escapeHtml(item.query)} → ${escapeHtml(productResult.lcsc_code || '')} ${escapeHtml(productResult.product_name || '')}</span>
                        </div>`;
                    } else {
                        resultHtml = `<div class="batch-result fail"><span>${escapeHtml(item.component_name)} · ${escapeHtml(item.query || '无参数')} → ${escapeHtml(productResult.error || '未找到')}</span></div>`;
                    }
                    batchPreview.insertAdjacentHTML('beforeend', resultHtml);
                    batchSearchButton.textContent = `正在搜索 ${index + 1}/${names.length}…`;
                }
            } finally {
                batchSearchRunning = false;
                batchSearchButton.textContent = '搜索所选元件'; syncBatchSelectionUi();
            }
        });
        batchApplyButton.addEventListener('click', async () => {
            const updates = batchLcscResults.filter(item => item.product && item.product.success);
            const failedCount = batchLcscResults.length - updates.length;
            if (!updates.length) return;
            if (!confirm(`更新 ${updates.length} 个搜索成功元件的立创内容？${failedCount ? `\n另有 ${failedCount} 个搜索失败项不会更新。` : ''}\n\n元件参数、货位和替换料不会改变。`)) return;
            batchApplyButton.disabled = true; batchApplyButton.textContent = '更新中…';
            try {
                const result = await fetch(api('/api/batch_update_lcsc'), {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ updates })
                }).then(response => readApiJson(response, '批量更新接口'));
                if (!result.success) throw new Error(result.error || '批量更新失败');
                batchSelectedComponents.clear();
                batchLcscResults = [];
                await loadComponents({ preserveScroll: true });
                alert(`已更新 ${result.updated_count} 个元件的立创内容`);
            } catch (error) {
                alert('批量更新失败: ' + error.message);
            } finally {
                batchApplyButton.textContent = '更新搜索成功项'; syncBatchSelectionUi();
            }
        });

        /* ==================== 立创搜索 ==================== */
        const lcscBtn = document.getElementById('search-lcsc-btn');
        lcscBtn.addEventListener('click', async () => {
            const kw = (paramInput.value.trim() + selectedParamUnit).trim();
            if (!kw) return alert('请先在参数框输入 立创编号(Cxxxx) / 型号 / 商品链接');
            // 新搜索开始即清除旧结果，防止失败后保存到上一次搜索得到的型号。
            window._lastFetchedData = null;
            lcscBtn.disabled = true; lcscBtn.textContent = '搜索中…';
            try {
                const r = await fetch(api('/api/crawl_lcsc') + '&keyword=' + encodeURIComponent(kw)).then(r => r.json());
                if (r.success) {
                    window._lastFetchedData = r;
                    // 立创返回的商品图随当前元件一起入库，用户也可以手动移除。
                    updateComponentImage(r.image || '');
                    if (r.footprint && !footprintInput.value.trim()) footprintInput.value = r.footprint;
                    if (r.工作电压 && r.工作电压 !== 'N/A') voltageInput.value = r.工作电压;
                    // 把参数名替换为立创返回的型号 (e.g. 搜索 C357836 后填入 AON6382)
                    if (r.product_name) {
                        paramInput.value = r.product_name;
                        // 取消可能残留的单位按钮选中,避免拼出 AON6382 + 单位
                        document.querySelectorAll('.chip-btn[data-unit].selected').forEach(b => b.classList.remove('selected'));
                        selectedParamUnit = '';
                    }
                    renderLcsc(r);
                    noteInput.value = buildNote(r);
                } else {
                    renderLcscError(r.error || '未找到');
                }
            } catch (err) { renderLcscError('网络错误: ' + err.message); }
            finally { lcscBtn.disabled = false; lcscBtn.textContent = '搜索立创'; }
        });
        function buildNote(r) {
            let n = `【${r.lcsc_code || ''} ${r.product_name || ''}】${r.brand ? ' · ' + r.brand : ''}\n`;
            n += `【类目】${r.类目 || r.catalog}\n`;
            const ps = Object.entries(r.params || {}).slice(0, 12).map(([k, v]) => `• ${k}: ${v}`);
            if (ps.length) n += `【参数】\n${ps.join('\n')}\n`;
            if (r.description && r.description !== 'N/A') n += `【描述】${r.description}`;
            return n;
        }
        function renderLcsc(r) {
            const box = document.getElementById('lcsc-result');
            const params = Object.entries(r.params || {}).map(([k, v]) => `<span class="lcsc-param"><b>${escapeHtml(k)}</b>: ${escapeHtml(v)}</span>`).join('');
            box.innerHTML = `<div class="lcsc-card">
                <div class="lcsc-top">
                    ${r.image ? `<img src="${escapeHtml(r.image)}" onerror="this.style.display='none'">` : ''}
                    <div>
                        <div class="lcsc-title">${escapeHtml(r.product_name || '')}</div>
                        <div class="lcsc-meta">${escapeHtml(r.lcsc_code || '')} · ${escapeHtml(r.brand || '')} · ${escapeHtml(r.catalog || '')}</div>
                    </div>
                </div>
                ${params ? `<div class="lcsc-params">${params}</div>` : ''}
                <div class="lcsc-links">
                    ${r.product_url ? `<a href="${escapeHtml(r.product_url)}" target="_blank">商品页 ↗</a>` : ''}
                    ${r.datasheet ? ` &nbsp; <a href="${escapeHtml(r.datasheet)}" target="_blank">数据手册 ↗</a>` : ''}
                    ${r.stock != null ? ` &nbsp; <span style="color:var(--text-muted)">库存 ${r.stock}</span>` : ''}
                </div>
            </div>`;
            box.style.display = 'block';
        }
        function renderLcscError(msg) {
            const box = document.getElementById('lcsc-result');
            box.innerHTML = `<div class="lcsc-card" style="background:#fff7f7;border-color:#f6d5d5;">
                <div style="font-weight:700;color:var(--red);font-size:12.5px;">立创抓取未成功</div>
                <div style="font-size:12px;color:var(--text-muted);margin-top:4px;white-space:pre-wrap;">${escapeHtml(msg)}</div></div>`;
            box.style.display = 'block';
        }

        /* ==================== BOM 上传 ==================== */
        async function handleBomUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const st = document.getElementById('bom-status-text');
            st.textContent = '正在上传…';
            const fd = new FormData(); fd.append('file', file);
            try {
                const r = await fetch('/api/upload_bom', { method: 'POST', body: fd }).then(r => r.json());
                if (r.success) {
                    st.textContent = '✅ 已更新，刷新预览';
                    bomFrame.src = '/bom_view?' + Date.now();
                    setTimeout(() => st.textContent = 'BOM 已就绪', 2500);
                } else st.textContent = '❌ ' + r.error;
            } catch (err) { st.textContent = '❌ 网络错误'; }
        }

        /* ==================== 接收 BOM 选中 → 全局提示框 ==================== */
        const gToast = document.getElementById('g-toast');
        let gTimer;
        gToast.addEventListener('click', () => gToast.classList.remove('show'));
        function showGlobalToast(found, name, sub, box, pos) {
            gToast.className = found ? 'ok' : 'warn';
            gToast.innerHTML = `<div class="gt-ic">${found ? '📍' : '❓'}</div>
                <div class="gt-main"><div class="gt-title">${escapeHtml(name)}</div>${sub ? `<div class="gt-sub">${escapeHtml(sub)}</div>` : ''}</div>
                ${found ? `<div class="gt-loc"><div class="gt-chip"><b>${box}</b><span>料盒 BOX</span></div><div class="gt-chip"><b>${pos}</b><span>位置 POS</span></div></div>` : ''}`;
            void gToast.offsetWidth; gToast.classList.add('show');
            clearTimeout(gTimer); gTimer = setTimeout(() => gToast.classList.remove('show'), found ? 5000 : 3200);
        }
        let itemlibSerialPort = null;
        let itemlibSerialWriter = null;
        let itemlibSerialConnected = false;
        let itemlibSerialConnecting = false;

        function updateItemlibSerialButton(state) {
            const button = document.getElementById('itemlib-serial-button');
            if (!button) return;

            button.disabled = state === 'connecting';
            button.textContent = state === 'connected'
                ? '断开点灯主控'
                : (state === 'connecting' ? '正在连接…' : '连接点灯主控');
            button.style.background = state === 'connected' ? '#16a34a' : '#2563eb';
        }

        function clearItemlibSerialState() {
            if (itemlibSerialWriter) {
                try { itemlibSerialWriter.releaseLock(); } catch (_) { /* 已断开时忽略 */ }
            }
            itemlibSerialWriter = null;
            itemlibSerialPort = null;
            itemlibSerialConnected = false;
            itemlibSerialConnecting = false;
            updateItemlibSerialButton('disconnected');
        }

        async function disconnectItemlibMaster() {
            const port = itemlibSerialPort;
            clearItemlibSerialState();
            if (!port) return;

            try {
                await port.close();
            } catch (error) {
                console.warn('关闭点灯主控串口失败:', error);
            }
        }

        async function connectItemlibMaster() {
            if (itemlibSerialConnected) {
                await disconnectItemlibMaster();
                return;
            }
            if (itemlibSerialConnecting) return;
            if (!('serial' in navigator)) {
                alert('当前浏览器不支持 Web Serial，请使用最新版 Chrome 或 Edge。');
                return;
            }

            itemlibSerialConnecting = true;
            updateItemlibSerialButton('connecting');
            let port = null;
            try {
                /* 不设置筛选条件，每次由用户在浏览器窗口中手动选择串口。 */
                port = await navigator.serial.requestPort();
                await port.open({
                    baudRate: 115200,
                    dataBits: 8,
                    stopBits: 1,
                    parity: 'none',
                    flowControl: 'none'
                });
                itemlibSerialPort = port;
                itemlibSerialWriter = port.writable.getWriter();
                itemlibSerialConnected = true;
                itemlibSerialConnecting = false;
                updateItemlibSerialButton('connected');
            } catch (error) {
                console.error('连接主控串口失败:', error);
                if (port?.readable || port?.writable) {
                    try { await port.close(); } catch (_) { /* 忽略清理错误 */ }
                }
                clearItemlibSerialState();
                if (error.name !== 'NotFoundError') {
                    alert(`连接点灯主控失败：${error.message}`);
                }
            }
        }

        async function sendItemlibLightCommand(boxId, ledId) {
            if (!itemlibSerialWriter) return;
            const box = Number(boxId);
            const led = Number(ledId);
            if (!Number.isInteger(box) || !Number.isInteger(led)) return;

            const command = `box_id:${box},led_id:${led}\n`;
            try {
                await itemlibSerialWriter.write(new TextEncoder().encode(command));
            } catch (error) {
                await disconnectItemlibMaster();
                throw error;
            }
        }

        function installItemlibSerialButton() {
            const button = document.createElement('button');
            button.id = 'itemlib-serial-button';
            button.type = 'button';
            button.textContent = '连接点灯主控';
            button.style.cssText = 'position:fixed;right:18px;bottom:18px;z-index:10000;padding:10px 16px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2);cursor:pointer';
            button.addEventListener('click', connectItemlibMaster);
            document.body.appendChild(button);
        }

        if ('serial' in navigator) {
            navigator.serial.addEventListener('disconnect', event => {
                if (event.target === itemlibSerialPort) {
                    console.warn('点灯主控串口已断开');
                    clearItemlibSerialState();
                }
            });
        }

        window.addEventListener('message', e => {
            const m = e.data;
            if (!m || m.source !== 'il-bom-bridge' || m.type !== 'selection') return;
            const sub = [m.designators, m.param, m.footprint].filter(Boolean).join(' · ');
            if (m.found) {
                showGlobalToast(true, m.name, sub, m.box_id, m.pos_id);
                sendItemlibLightCommand(m.box_id, m.pos_id).catch(error => {
                    console.error('发送点灯命令失败:', error);
                });
            }
            else showGlobalToast(false, '未找到货位: ' + m.name, sub);
        });

        /* ==================== 初始化 ==================== */
        document.addEventListener('DOMContentLoaded', async () => {
            installItemlibSerialButton();
            compNameInput.value = generateRandomID();
            // 先加载仓库列表,再渲染侧栏 tab,最后才拉元件 — 否则 api() 没有正确的 repo id。
            await loadRepos();
            renderRepoBar();
            await loadComponents();
        });
    </script>
</body>

</html>
