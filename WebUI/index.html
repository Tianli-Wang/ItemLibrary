<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人元件库 · Item Library</title>
    <style>
        :root {
            --sidebar-width: 208px;
            --bg: #f5f6f8;
            --surface: #ffffff;
            --surface-2: #f7f8fa;
            --border: #e9eaee;
            --border-strong: #dcdfe4;
            --text: #1b1d21;
            --text-muted: #656b76;
            --text-faint: #9aa0aa;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-soft: #eef3ff;
            --accent-soft-border: #dbe6ff;
            --green: #16a34a;
            --green-soft: #eafaf0;
            --orange: #ea580c;
            --red: #e11d48;
            --purple: #6d5ce6;
            --r: 12px;
            --r-sm: 8px;
            --r-pill: 999px;
            --sh-sm: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .07);
            --sh: 0 2px 6px rgba(16, 24, 40, .05), 0 6px 16px rgba(16, 24, 40, .06);
            --sh-lg: 0 12px 34px rgba(16, 24, 40, .14);
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            margin: 0;
            height: 100vh;
            display: flex;
            overflow: hidden;
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
        }

        /* ---------------- Sidebar ---------------- */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 100;
            /* 宽度动画会让右侧数百张网格卡片逐帧重排，收起时改为一次完成。 */
        }

        .sidebar-header {
            min-height: 68px;
            padding: 16px 14px 12px 16px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: .2px;
            display: flex;
            align-items: center;
            gap: 9px;
        }
        .brand-copy { min-width: 0; flex: 1; }
        .brand-title { white-space: nowrap; }
        .brand-subtitle { margin-top: 2px; color: var(--text-faint); font-size: 10px; font-weight: 500; letter-spacing: .35px; }
        .sidebar-toggle, .panel-toggle {
            width: 28px; height: 28px; flex: 0 0 auto;
            display: grid; place-items: center;
            border: 1px solid var(--border); border-radius: 8px;
            background: var(--surface); color: var(--text-muted);
            cursor: pointer; font: inherit; transition: all .15s;
        }
        .sidebar-toggle:hover, .panel-toggle:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
        .sidebar-toggle span, .panel-toggle span { transition: transform .16s ease; }

        .logo-badge {
            width: 28px; height: 28px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--accent), #4f7cff);
            display: grid; place-items: center;
            color: #fff; font-size: 15px;
            box-shadow: 0 4px 10px rgba(37, 99, 235, .35);
        }

        .nav-section-label {
            padding: 6px 22px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .6px;
            color: var(--text-faint);
            text-transform: uppercase;
        }

        .nav-menu { padding: 8px 10px; flex-grow: 1; }

        .nav-item {
            width: 100%;
            border: 0;
            background: transparent;
            font: inherit;
            padding: 9px 12px;
            margin-bottom: 3px;
            border-radius: var(--r-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 11px;
            color: var(--text-muted);
            font-weight: 500;
            transition: background .15s, color .15s;
            user-select: none;
        }
        .nav-item .nav-ic { font-size: 16px; width: 20px; text-align: center; }
        .nav-item:hover { background: var(--surface-2); color: var(--text); }
        .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

        /* 仓库 tab:每个仓库是一个 nav-item;长按 / 右键可改名或删除。 */
        .nav-item[data-repo-id] .nav-meta { display: flex; flex-direction: column; min-width: 0; flex: 1; }
        .nav-item[data-repo-id] .nav-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .nav-item[data-repo-id] .nav-note {
            font-size: 10.5px; color: var(--text-faint); margin-top: 1px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            max-width: 100%;
        }
        .nav-item.active .nav-note { color: var(--accent); opacity: .65; }
        .nav-item[data-repo-id][data-editable="true"] .repo-edit-btn {
            flex: 0 0 auto; width: 22px; height: 22px;
            display: none; align-items: center; justify-content: center;
            border: 0; background: transparent; color: inherit;
            border-radius: 5px; cursor: pointer; font-size: 13px;
        }
        .nav-item[data-repo-id][data-editable="true"]:hover .repo-edit-btn { display: inline-flex; }
        .nav-item[data-repo-id][data-editable="true"] .repo-edit-btn:hover { background: rgba(0,0,0,.06); }

        .repo-actions {
            padding: 4px 10px 10px;
        }
        .repo-add-btn {
            width: 100%; padding: 8px 10px; border-radius: var(--r-sm);
            border: 1px dashed var(--border-strong); background: var(--surface-2);
            color: var(--text-muted); cursor: pointer; font: inherit;
            font-size: 12.5px; font-weight: 600;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            transition: all .15s;
        }
        .repo-add-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

        /* 仓库创建 / 改名 / 删除 对话框 */
        #repo-dialog { padding: 0; border: 0; border-radius: var(--r); }
        #repo-dialog::backdrop { background: rgba(15,23,42,.42); }
        .repo-dialog-box {
            width: 360px; padding: 22px 24px 18px;
            background: var(--surface); color: var(--text);
            border-radius: var(--r); box-shadow: var(--sh-lg);
        }
        .repo-dialog-box h3 { margin: 0 0 6px; font-size: 15px; font-weight: 700; }
        .repo-dialog-box p { margin: 0 0 14px; font-size: 12px; color: var(--text-muted); }
        .repo-dialog-box label { font-size: 12px; }
        .repo-dialog-box .btn-row { margin-top: 14px; }
        .repo-dialog-error {
            margin-top: 10px; padding: 8px 10px; border-radius: 6px;
            background: #fff4f5; color: var(--red); font-size: 12px; display: none;
        }
        .repo-dialog-error.show { display: block; }

        .sidebar-footer {
            padding: 12px;
            border-top: 1px solid var(--border);
        }
        .stat-pill {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 12px; border-radius: var(--r-sm);
            background: var(--surface-2); font-size: 12px; color: var(--text-muted);
        }
        .stat-pill b { color: var(--text); font-size: 15px; }
        body.sidebar-collapsed { --sidebar-width: 68px; }
        body.sidebar-collapsed .sidebar-header { padding-inline: 14px; justify-content: center; }
        body.sidebar-collapsed .brand-copy,
        body.sidebar-collapsed .nav-section-label,
        body.sidebar-collapsed .nav-item > span:not(.nav-ic),
        body.sidebar-collapsed .nav-item .nav-meta,
        body.sidebar-collapsed .nav-item .repo-edit-btn,
        body.sidebar-collapsed .repo-add-btn > span:last-child,
        body.sidebar-collapsed .import-row,
        body.sidebar-collapsed .stat-pill > span { display: none; }
        body.sidebar-collapsed .sidebar-toggle { position: absolute; top: 51px; width: 22px; height: 22px; border-radius: 50%; font-size: 10px; }
        body.sidebar-collapsed .nav-menu { padding: 20px 9px 8px; }
        body.sidebar-collapsed .nav-item { justify-content: center; padding: 10px; }
        body.sidebar-collapsed .nav-item .nav-ic { width: auto; }
        body.sidebar-collapsed .sidebar-footer { padding: 9px; }
        body.sidebar-collapsed .stat-pill { justify-content: center; padding: 10px 4px; }
        body.sidebar-collapsed .sidebar-toggle span { transform: rotate(180deg); }

        /* ---------------- Resizers ---------------- */
        .resizer { background: transparent; position: relative; z-index: 200; transition: background .2s; flex-shrink: 0; }
        .resizer.horizontal { width: 6px; cursor: col-resize; }
        .resizer.horizontal::after {
            content: ""; position: absolute; left: 2px; top: 0; bottom: 0; width: 1px; background: var(--border);
        }
        .resizer:hover, .resizer.resizing { background: var(--accent-soft); }
        body.is-resizing { cursor: col-resize; user-select: none; }

        /* ---------------- Main ---------------- */
        .main-content { flex-grow: 1; min-width: 0; height: 100vh; overflow: hidden; position: relative; }
        .page-panel { display: none; height: 100vh; width: 100%; overflow: hidden; padding: 20px; }
        .page-panel.active { display: flex; }
        #bom-panel.active, #bom-panel { padding: 0; }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r);
            box-shadow: var(--sh-sm);
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .card-head {
            padding: 18px 20px 14px;
            border-bottom: 1px solid var(--border);
        }
        .card-head h2 { margin: 0; font-size: 15px; font-weight: 650; }
        .card-head p { margin: 3px 0 0; font-size: 12.5px; color: var(--text-muted); }
        .card-head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .form-rail-label {
            display: none; writing-mode: vertical-rl; letter-spacing: 4px;
            color: var(--text-muted); font-size: 12px; font-weight: 650; margin: 12px auto;
        }

        .form-section { width: 380px; flex-shrink: 0; }
        .form-body { padding: 18px 20px; overflow-y: auto; }
        .list-section { flex-grow: 1; }
        #management-panel.form-collapsed .form-section { width: 52px !important; min-width: 52px; }
        #management-panel.form-collapsed .form-section .card-head { padding: 11px; border-bottom: 0; }
        #management-panel.form-collapsed .form-section .card-head h2,
        #management-panel.form-collapsed .form-section .card-head p,
        #management-panel.form-collapsed .form-section .form-body { display: none; }
        #management-panel.form-collapsed .form-rail-label { display: block; }
        #management-panel.form-collapsed #form-resizer { display: none; }
        #management-panel.form-collapsed .panel-toggle span { transform: rotate(180deg); }

        label { font-weight: 600; display: block; margin-bottom: 6px; font-size: 12.5px; color: var(--text-muted); }

        input[type="text"], input[type="number"], textarea {
            width: 100%;
            padding: 9px 11px;
            border: 1px solid var(--border-strong);
            border-radius: var(--r-sm);
            font-size: 13.5px;
            font-family: inherit;
            background: var(--surface);
            color: var(--text);
            transition: border-color .15s, box-shadow .15s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        textarea { resize: vertical; min-height: 62px; line-height: 1.5; }
        .field { margin-bottom: 14px; }
        .field:last-child { margin-bottom: 0; }

        .two-col { display: flex; gap: 12px; }
        .two-col > .field { flex: 1; margin-bottom: 0; }

        .label-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
        .label-row label { margin-bottom: 0; }

        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
        .chip-btn {
            font-size: 11.5px; padding: 3px 9px; background: var(--surface-2);
            color: var(--text-muted); border: 1px solid var(--border);
            border-radius: var(--r-pill); cursor: pointer; font-weight: 600;
            user-select: none; transition: all .15s;
        }
        .chip-btn:hover { border-color: var(--accent); color: var(--accent); }
        .chip-btn.selected { background: var(--accent); color: #fff; border-color: var(--accent); }

        .btn {
            padding: 10px 14px; border: none; border-radius: var(--r-sm);
            cursor: pointer; font-size: 13.5px; font-weight: 600;
            font-family: inherit; transition: background .15s, transform .05s;
        }
        .btn:active { transform: translateY(1px); }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-amber { background: #f59e0b; color: #fff; }
        .btn-amber:hover { background: #d97706; }
        .btn-green { background: var(--green); color: #fff; white-space: nowrap; }
        .btn-green:hover { background: #12813c; }
        .btn-ghost { background: var(--surface); border: 1px solid var(--border-strong); color: var(--text-muted); }
        .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
        .btn-row { display: flex; gap: 10px; margin-top: 4px; }
        .btn-row .btn { flex: 1; }

        .input-with-btn { display: flex; gap: 8px; }
        .input-with-btn input { flex: 1; }

        /* LCSC result */
        #lcsc-result { margin-top: 12px; display: none; }
        .lcsc-card {
            border: 1px solid var(--accent-soft-border);
            background: var(--accent-soft);
            border-radius: var(--r-sm);
            padding: 12px;
        }
        .lcsc-top { display: flex; gap: 12px; }
        .lcsc-top img { width: 54px; height: 54px; object-fit: contain; background: #fff; border-radius: 6px; border: 1px solid var(--border); }
        .lcsc-title { font-weight: 700; font-size: 13.5px; }
        .lcsc-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .lcsc-params { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
        .lcsc-param { font-size: 11px; background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 3px 7px; }
        .lcsc-param b { color: var(--text); }
        .lcsc-links { margin-top: 8px; font-size: 12px; }
        .lcsc-links a { color: var(--accent); text-decoration: none; font-weight: 600; }

        /* 元件图片与替换料选择器 */
        .image-field-row { display: flex; align-items: center; gap: 9px; }
        .image-field-row img {
            width: 48px; height: 48px; flex: 0 0 auto; object-fit: contain;
            border: 1px solid var(--border); border-radius: 7px; background: #fff;
        }
        .image-field-row input { min-width: 0; color: var(--text-muted); background: var(--surface-2); }
        .image-field-row .icon-btn { flex: 0 0 auto; }
        .substitute-picker { position: relative; }
        .substitute-selected { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 7px; }
        .substitute-selected:empty { display: none; }
        .substitute-chip, .comp-substitute {
            display: inline-flex; align-items: center; gap: 5px; border-radius: var(--r-pill);
            border: 1px solid #d9d3fa; background: #f5f2ff; color: var(--purple);
            padding: 3px 8px; font-size: 11px; font-weight: 650;
        }
        .substitute-chip button { border: 0; background: none; color: inherit; padding: 0; cursor: pointer; font-size: 13px; }
        .substitute-options {
            display: none; max-height: 190px; overflow-y: auto; margin-top: 5px;
            border: 1px solid var(--border-strong); border-radius: var(--r-sm);
            background: var(--surface); box-shadow: var(--sh); padding: 5px;
        }
        .substitute-options.open { display: block; }
        .substitute-option {
            display: flex; align-items: center; gap: 8px; padding: 7px 8px;
            border-radius: 6px; cursor: pointer; font-size: 12px;
        }
        .substitute-option:hover { background: var(--surface-2); }
        .substitute-option input { width: auto; margin: 0; }
        .substitute-option span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .substitute-empty { padding: 10px; color: var(--text-faint); font-size: 12px; text-align: center; }

        /* ---------------- Toolbar ---------------- */
        .toolbar { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
        .search-primary-row, .toolbar-footer { display: flex; align-items: center; gap: 8px; }
        .global-search {
            position: relative; flex: 1; min-width: 220px;
        }
        .global-search .search-icon {
            position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
            color: var(--text-faint); font-size: 15px; pointer-events: none;
        }
        .global-search input {
            height: 38px; padding: 8px 72px 8px 34px;
            background: var(--surface-2); border-color: transparent;
        }
        .global-search input:focus { background: var(--surface); }
        .search-shortcut {
            position: absolute; right: 34px; top: 50%; transform: translateY(-50%);
            border: 1px solid var(--border-strong); border-bottom-width: 2px;
            border-radius: 5px; padding: 1px 5px; color: var(--text-faint);
            background: var(--surface); font-size: 10px; font-family: inherit;
        }
        .input-clear {
            display: none; position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
            width: 22px; height: 22px; border: 0; border-radius: 6px;
            background: transparent; color: var(--text-faint); cursor: pointer; font-size: 16px;
        }
        .input-clear:hover { color: var(--text); background: var(--border); }
        .global-search.has-value .input-clear { display: grid; place-items: center; }
        .global-search.has-value .search-shortcut { display: none; }
        .filter-toggle {
            height: 38px; padding: 0 12px; display: inline-flex; align-items: center; gap: 7px;
            border: 1px solid var(--border-strong); border-radius: var(--r-sm);
            background: var(--surface); color: var(--text-muted); cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 650;
        }
        .filter-toggle:hover, .filter-toggle.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
        .filter-count {
            min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
            display: grid; place-items: center; background: var(--accent); color: white; font-size: 10px;
        }
        .filter-count:empty, .filter-count[data-count="0"] { display: none; }
        .clear-search {
            height: 38px; padding: 0 10px; border: 0; background: transparent;
            color: var(--text-faint); cursor: pointer; font: inherit; font-size: 12px;
        }
        .clear-search:hover:not(:disabled) { color: var(--accent); }
        .clear-search:disabled { opacity: .4; cursor: default; }
        .advanced-search {
            padding: 12px; border-radius: var(--r-sm);
            background: var(--surface-2); border: 1px solid var(--border);
        }
        .advanced-search[hidden] { display: none; }
        .filter-grid { display: grid; grid-template-columns: repeat(6, minmax(80px, 1fr)); gap: 8px; }
        .filter-field label { margin: 0 0 4px; font-size: 10.5px; color: var(--text-faint); }
        .filter-field input { padding: 7px 9px; font-size: 12px; background: var(--surface); }
        .range-row { display: flex; align-items: flex-end; gap: 8px; margin-top: 9px; }
        .range-row .filter-field { flex: 1; }
        .range-separator { padding-bottom: 8px; color: var(--text-faint); font-size: 11px; }
        .range-hint { margin-left: auto; padding-bottom: 7px; min-width: 120px; text-align: right; color: var(--text-faint); font-size: 10.5px; }
        .range-hint.error { color: var(--red); font-weight: 600; }
        .toolbar-footer { min-height: 29px; }
        .batch-toolbar {
            display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
            padding-top: 10px; border-top: 1px solid var(--border);
        }
        .batch-count { color: var(--text-muted); font-size: 12px; font-weight: 650; min-width: 66px; }
        .batch-toolbar .btn { padding: 7px 10px; font-size: 12px; }
        .batch-preview {
            display: none; flex-basis: 100%; gap: 6px; flex-wrap: wrap;
            color: var(--text-muted); font-size: 11.5px;
        }
        .batch-preview.show { display: flex; }
        .batch-result {
            display: flex; align-items: center; gap: 7px; min-width: 220px; max-width: 360px;
            padding: 6px 8px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface-2);
        }
        .batch-result.ok { border-color: #bfe8cb; background: var(--green-soft); }
        .batch-result.fail { border-color: #f5cbd3; background: #fff4f5; color: var(--red); }
        .batch-result img { width: 34px; height: 34px; flex: 0 0 auto; object-fit: contain; border: 1px solid var(--border); border-radius: 5px; background: #fff; }
        .batch-result span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .result-summary { margin-right: auto; color: var(--text-muted); font-size: 11.5px; white-space: nowrap; }
        .result-summary b { color: var(--text); }
        .active-filters { display: flex; flex-wrap: wrap; gap: 5px; }
        .active-filters:empty { display: none; }
        .active-filter {
            border: 1px solid var(--accent-soft-border); border-radius: var(--r-pill);
            background: var(--accent-soft); color: var(--accent); padding: 3px 8px;
            cursor: pointer; font: inherit; font-size: 10.5px; font-weight: 600;
        }
        .active-filter:hover { border-color: var(--accent); }
        .sort-group { display: flex; gap: 6px; }
        .sort-badge {
            padding: 5px 12px; background: var(--surface-2); color: var(--text-muted);
            border-radius: var(--r-pill); font-size: 12px; cursor: pointer; font-weight: 600;
            border: 1px solid transparent; user-select: none; transition: all .15s;
        }
        .sort-badge:hover { background: #eef0f3; }
        .sort-badge.active { background: var(--accent); color: #fff; }
        .dir-toggle {
            padding: 5px 12px; background: var(--surface); border: 1px solid var(--border-strong);
            border-radius: var(--r-pill); font-size: 12px; cursor: pointer; font-weight: 600;
            color: var(--text); display: flex; align-items: center; gap: 5px;
        }
        .dir-toggle:hover { border-color: var(--accent); color: var(--accent); }

        @media (max-width: 1120px) {
            .filter-grid { grid-template-columns: repeat(3, minmax(90px, 1fr)); }
            .sort-badge { padding-inline: 9px; }
            .form-section { width: 350px; }
        }
        @media (max-width: 820px) {
            body { display: block; height: auto; min-height: 100vh; overflow: auto; }
            .sidebar {
                position: sticky; top: 0; width: 100% !important; height: 60px;
                flex-direction: row; align-items: center; border-right: 0; border-bottom: 1px solid var(--border);
            }
            .sidebar-header { min-height: 60px; padding: 10px 14px; }
            .brand-subtitle, .sidebar-toggle, .nav-section-label, .import-row, .sidebar-footer { display: none !important; }
            body.sidebar-collapsed .brand-copy { display: block; }
            .nav-menu { display: flex; margin-left: auto; flex-grow: 0; padding: 7px 10px; }
            .nav-item { width: auto; margin: 0 0 0 4px; }
            .resizer { display: none; }
            .main-content, .page-panel { height: auto; min-height: calc(100vh - 60px); }
            .page-panel { padding: 10px; overflow: visible; }
            #management-panel.active { flex-direction: column; gap: 10px; }
            .form-section, #management-panel.form-collapsed .form-section { width: 100% !important; min-width: 0; height: auto; max-height: none; }
            #management-panel.form-collapsed .form-section .card-head h2,
            #management-panel.form-collapsed .form-section .card-head p { display: block; }
            #management-panel.form-collapsed .form-section .form-body { display: block; }
            #management-panel.form-collapsed .form-rail-label { display: none; }
            .panel-toggle { display: none; }
            .card { height: auto; }
            .form-body { overflow: visible; }
            .list-section { min-height: 680px; }
            .search-primary-row, .toolbar-footer { flex-wrap: wrap; }
            .global-search { flex-basis: 100%; }
            .filter-grid { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
            .result-summary { flex-basis: 100%; }
        }

        /* ---------------- Component list ---------------- */
        #list-container { flex-grow: 1; overflow-y: auto; padding: 12px 18px 18px; }
        #component-list {
            list-style: none; padding: 0; margin: 0; display: grid; gap: 10px;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            contain: layout style;
        }

        .comp-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-sm);
            padding: 13px 14px; transition: border-color .15s, box-shadow .15s, transform .1s;
            display: flex; flex-direction: column; gap: 9px; cursor: pointer;
            contain: layout paint;
        }
        .comp-card:hover { border-color: var(--accent-soft-border); box-shadow: var(--sh); }
        .comp-card.batch-selected { border-color: var(--accent); background: var(--accent-soft); }
        .comp-card.flash { animation: flash 1.2s ease; }
        @keyframes flash { 0%, 100% { background: var(--surface); } 30% { background: var(--accent-soft); } }

        .comp-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
        .comp-main { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
        .comp-image {
            width: 54px; height: 54px; flex: 0 0 auto; object-fit: contain;
            border: 1px solid var(--border); border-radius: 7px; background: #fff;
        }
        .comp-title { font-size: 15px; font-weight: 700; line-height: 1.25; }
        .comp-title .fp { color: var(--text-muted); font-weight: 500; font-size: 13px; }
        .comp-id { font-size: 11px; color: var(--text-faint); font-family: ui-monospace, Menlo, Consolas, monospace; margin-top: 2px; }

        .comp-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .batch-checkbox {
            width: 17px; height: 17px; margin: 5px 2px 0 0; accent-color: var(--accent);
            cursor: pointer;
        }
        .icon-btn {
            width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--border);
            background: var(--surface); cursor: pointer; display: grid; place-items: center;
            font-size: 13px; color: var(--text-muted); transition: all .15s;
        }
        .icon-btn:hover { background: var(--surface-2); }
        .icon-btn.del:hover { background: #fef2f2; color: var(--red); border-color: #fecdd6; }
        .icon-btn.swap:hover { background: #f3f1fe; color: var(--purple); border-color: #ddd8fb; }
        .icon-btn.swap.pending { background: var(--purple); color: #fff; border-color: var(--purple); animation: pulse 1.4s infinite; }
        @keyframes pulse { 50% { opacity: .55; } }

        .comp-loc { display: flex; gap: 8px; }
        .loc-box {
            display: flex; align-items: center; gap: 6px; background: var(--surface-2);
            border: 1px solid var(--border); border-radius: var(--r-sm); padding: 5px 9px;
        }
        .loc-box .lbl { font-size: 10.5px; color: var(--text-faint); font-weight: 700; letter-spacing: .4px; }
        .loc-box input {
            width: 44px; padding: 3px 4px; text-align: center; font-size: 13px; font-weight: 700;
            border: 1px solid transparent; background: transparent; border-radius: 5px; color: var(--text);
        }
        .loc-box input:focus { background: #fff; border-color: var(--accent); box-shadow: none; }

        .badges { display: flex; flex-wrap: wrap; gap: 5px; }
        .badge {
            display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 6px;
            font-size: 11px; font-weight: 600; border: 1px solid transparent;
        }
        .badge.volt { background: #fff5e9; color: var(--orange); border-color: #ffe2c2; }
        .badge.cat { background: #f1eee9; color: #6b533d; border-color: #e2d9cd; }
        .badge.type { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-soft-border); }
        .badge.cur { background: #f5f0fe; color: var(--purple); border-color: #e5defb; }
        .comp-substitutes { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; font-size: 11px; color: var(--text-faint); }

        .comp-note {
            font-size: 12px; color: var(--text-muted); background: var(--surface-2);
            border: 1px solid var(--border); border-left: 3px solid var(--accent);
            border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; line-height: 1.55;
            max-height: 3.4em; overflow: hidden; position: relative; transition: max-height .25s;
        }
        .comp-note.expanded { max-height: 400px; }
        .comp-note.collapsed::after {
            content: "展开 ▾"; position: absolute; right: 8px; bottom: 4px; font-size: 10px;
            color: var(--accent); background: linear-gradient(90deg, transparent, var(--surface-2) 40%); padding-left: 20px;
        }

        .empty { text-align: center; color: var(--text-faint); padding: 60px 20px; font-size: 13px; }

        /* ---------------- BOM iframe ---------------- */
        #bom-frame { width: 100%; height: 100%; border: none; background: #fff; }

        /* ---------------- Import row ---------------- */
        .import-row { padding: 6px 12px 10px; }
        .import-btn {
            width: 100%; padding: 9px; border-radius: var(--r-sm); border: 1px dashed var(--border-strong);
            background: var(--surface-2); color: var(--text-muted); cursor: pointer; font-size: 12.5px; font-weight: 600;
            display: flex; align-items: center; justify-content: center; gap: 8px; transition: all .15s;
        }
        .import-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
        #bom-status-text { font-size: 11px; color: var(--text-faint); margin-top: 6px; text-align: center; }

        /* BOM 入口:与导入按钮共处一栏,但视觉上是常规 nav-item (实线边框、左右对齐)。 */
        #bom-nav-btn {
            border-style: solid;
            justify-content: flex-start;
            gap: 9px;
            padding: 9px 12px;
        }
        #bom-nav-btn .nav-ic { font-size: 16px; width: 20px; text-align: center; }
        #bom-nav-btn .nav-meta { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; flex: 1; }
        #bom-nav-btn .nav-name { font-size: 13px; }
        #bom-nav-btn .nav-note {
            font-size: 10.5px; color: var(--text-faint); margin-top: 1px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            max-width: 100%;
        }
        #bom-nav-btn.active .nav-note { color: var(--accent); opacity: .65; }
        body.sidebar-collapsed #bom-nav-btn .nav-meta { display: none; }
        body.sidebar-collapsed #bom-nav-btn { justify-content: center; padding: 10px; }

        /* ---------------- Global toast ---------------- */
        #g-toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-150%);
            z-index: 9999; min-width: 300px; max-width: 90vw; padding: 14px 20px; border-radius: 16px;
            color: #fff; box-shadow: var(--sh-lg); display: flex; align-items: center; gap: 16px;
            opacity: 0; transition: transform .34s cubic-bezier(.2,.9,.3,1.2), opacity .34s; cursor: pointer;
        }
        #g-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        #g-toast.ok { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
        #g-toast.warn { background: linear-gradient(135deg, #dc2626, #be123c); }
        #g-toast .gt-ic { font-size: 26px; }
        #g-toast .gt-main { flex: 1; min-width: 0; }
        #g-toast .gt-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #g-toast .gt-sub { font-size: 12px; opacity: .78; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #g-toast .gt-loc { display: flex; gap: 10px; }
        #g-toast .gt-chip { display: flex; flex-direction: column; align-items: center; padding: 6px 15px; border-radius: 12px; background: rgba(255,255,255,.16); }
        #g-toast .gt-chip b { font-size: 21px; font-weight: 800; line-height: 1; }
        #g-toast .gt-chip span { font-size: 10px; opacity: .75; margin-top: 3px; letter-spacing: .5px; }
    </style>
</head>

<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="logo-badge">◆</span>
            <div class="brand-copy">
                <div class="brand-title">个人元件库</div>
                <div class="brand-subtitle">ITEM LIBRARY</div>
            </div>
            <button type="button" class="sidebar-toggle" id="sidebar-toggle" title="收起导航" aria-label="收起导航">
                <span>‹</span>
            </button>
        </div>
        <div class="nav-section-label">仓库</div>
        <nav class="nav-menu" id="repo-bar" aria-label="仓库切换">
            <!-- 仓库 tab 由 JS 动态注入 -->
        </nav>
        <div class="repo-actions">
            <button type="button" class="repo-add-btn" id="repo-add-btn" title="新建仓库">
                <span>＋</span><span>新建仓库</span>
            </button>
        </div>
        <div class="import-row">
            <div class="nav-section-label" style="padding-left:10px;">交互式 BOM</div>
            <button type="button" class="nav-item import-btn" id="bom-nav-btn" title="BOM 交互" style="margin-bottom:6px;">
                <span class="nav-ic">🧩</span>
                <span class="nav-meta">
                    <span class="nav-name">BOM 交互</span>
                    <span class="nav-note">点亮立创EDA 离线 BOM</span>
                </span>
            </button>
            <button class="import-btn" onclick="document.getElementById('bom-upload-input').click()">
                <span>📥</span><span>导入 立创EDA BOM</span>
            </button>
            <input type="file" id="bom-upload-input" style="display:none" accept=".html" onchange="handleBomUpload(event)">
            <div id="bom-status-text">支持立创EDA离线交互式BOM</div>
        </div>
        <div class="sidebar-footer">
            <div class="stat-pill"><span>元件总数</span><b id="stat-count">0</b></div>
        </div>
    </aside>

    <div id="sidebar-resizer" class="resizer horizontal"></div>

    <main class="main-content">
        <!-- ===================== 元件库 ===================== -->
        <div id="management-panel" class="page-panel active">
            <div class="card form-section" id="form-section">
                <div class="card-head">
                    <div class="card-head-row">
                        <h2>录入 / 编辑元件</h2>
                        <button type="button" class="panel-toggle" id="form-toggle" title="收起录入面板" aria-label="收起录入面板">
                            <span>‹</span>
                        </button>
                    </div>
                    <p>每个元件对应一个 料盒(box_id) 与 位置(pos_id)</p>
                </div>
                <div class="form-rail-label">录入元件</div>
                <div class="form-body">
                    <form id="add-form">
                        <div class="field">
                            <label for="comp_name">元件名称（唯一 ID）</label>
                            <input type="text" id="comp_name" placeholder="自动生成…" required>
                        </div>

                        <div class="two-col" style="margin-bottom:14px;">
                            <div class="field">
                                <label for="box_id">料盒 box_id</label>
                                <input type="number" id="box_id" placeholder="1" required>
                            </div>
                            <div class="field">
                                <label for="led_id">位置 pos_id</label>
                                <input type="number" id="led_id" placeholder="1" required>
                            </div>
                        </div>

                        <div class="field">
                            <div class="label-row">
                                <label for="parameter">参数 parameter</label>
                                <div class="chips">
                                    <span class="chip-btn" data-unit="R">R</span>
                                    <span class="chip-btn" data-unit="K">K</span>
                                    <span class="chip-btn" data-unit="pF">pF</span>
                                    <span class="chip-btn" data-unit="nF">nF</span>
                                    <span class="chip-btn" data-unit="uF">uF</span>
                                    <span class="chip-btn" data-unit="nH">nH</span>
                                    <span class="chip-btn" data-unit="uH">uH</span>
                                </div>
                            </div>
                            <div class="input-with-btn">
                                <input type="text" id="parameter" placeholder="数值 / 型号 / 立创编号(Cxxxx)">
                                <button type="button" class="btn btn-green" id="search-lcsc-btn">搜索立创</button>
                            </div>
                            <div id="lcsc-result"></div>
                        </div>

                        <div class="field">
                            <div class="label-row">
                                <label for="footprint">封装 footprint</label>
                                <div class="chips">
                                    <span class="chip-btn" data-fp="0402">0402</span>
                                    <span class="chip-btn" data-fp="0603">0603</span>
                                    <span class="chip-btn" data-fp="0805">0805</span>
                                    <span class="chip-btn" data-fp="1206">1206</span>
                                </div>
                            </div>
                            <input type="text" id="footprint" placeholder="0603">
                        </div>

                        <div class="field">
                            <div class="label-row">
                                <label for="voltage">电压 voltage</label>
                                <div class="chips">
                                    <span class="chip-btn" data-volt="6.3V">6.3V</span>
                                    <span class="chip-btn" data-volt="10V">10V</span>
                                    <span class="chip-btn" data-volt="16V">16V</span>
                                    <span class="chip-btn" data-volt="25V">25V</span>
                                    <span class="chip-btn" data-volt="50V">50V</span>
                                    <span class="chip-btn" data-volt="100V">100V</span>
                                </div>
                            </div>
                            <input type="text" id="voltage" placeholder="16V">
                        </div>

                        <div class="field">
                            <label for="image_url">元件图片（立创搜索后自动保存）</label>
                            <div class="image-field-row">
                                <img id="component-image-preview" alt="元件图片预览" hidden>
                                <input type="text" id="image_url" placeholder="尚未获取图片" readonly>
                                <button type="button" class="icon-btn del" id="clear-image-btn" title="移除图片">✕</button>
                            </div>
                        </div>

                        <div class="field">
                            <label for="substitute-search">可替换料（可多选）</label>
                            <div class="substitute-picker" id="substitute-picker">
                                <div class="substitute-selected" id="substitute-selected"></div>
                                <input type="text" id="substitute-search" autocomplete="off" placeholder="输入名称、型号或参数筛选">
                                <div class="substitute-options" id="substitute-options"></div>
                            </div>
                        </div>

                        <div class="field">
                            <label for="note">备注 note</label>
                            <textarea id="note" placeholder="可选：用途、来源等"></textarea>
                        </div>

                        <div class="btn-row">
                            <button type="submit" class="btn btn-primary" id="add-btn">＋ 添加为新元件</button>
                            <button type="button" class="btn btn-amber" id="update-btn">更新</button>
                        </div>
                    </form>
                </div>
            </div>

            <div id="form-resizer" class="resizer horizontal"></div>

            <div class="card list-section">
                <div class="toolbar" role="search" aria-label="搜索元件">
                    <div class="search-primary-row">
                        <div class="global-search" id="global-search-wrap">
                            <span class="search-icon">⌕</span>
                            <input type="text" id="search-query" autocomplete="off"
                                placeholder="搜索名称、参数、封装、料盒或备注；空格可组合多个条件">
                            <kbd class="search-shortcut">/</kbd>
                            <button type="button" class="input-clear" id="clear-query-btn" title="清除关键词" aria-label="清除关键词">×</button>
                        </div>
                        <button type="button" class="filter-toggle" id="filter-toggle" aria-expanded="false" aria-controls="advanced-search">
                            <span>筛选</span><span class="filter-count" id="filter-count" data-count="0"></span><span id="filter-chevron">⌄</span>
                        </button>
                        <button type="button" class="clear-search" id="clear-search-btn" disabled>全部清空</button>
                    </div>
                    <div class="advanced-search" id="advanced-search" hidden>
                        <div class="filter-grid">
                            <div class="filter-field">
                                <label for="search-parameter">参数</label>
                                <input type="text" id="search-parameter" placeholder="10k / 104">
                            </div>
                            <div class="filter-field">
                                <label for="search-voltage">电压</label>
                                <input type="text" id="search-voltage" placeholder="16V">
                            </div>
                            <div class="filter-field">
                                <label for="search-footprint">封装</label>
                                <input type="text" id="search-footprint" placeholder="0603">
                            </div>
                            <div class="filter-field">
                                <label for="search-box">料盒号</label>
                                <input type="text" id="search-box" inputmode="numeric" placeholder="如 4">
                            </div>
                            <div class="filter-field">
                                <label for="search-pos">位置号</label>
                                <input type="text" id="search-pos" inputmode="numeric" placeholder="如 38">
                            </div>
                            <div class="filter-field">
                                <label for="search-note">备注</label>
                                <input type="text" id="search-note" placeholder="用途或分类">
                            </div>
                        </div>
                        <div class="range-row">
                            <div class="filter-field">
                                <label for="search-min">参数最小值</label>
                                <input type="text" id="search-min" placeholder="1k / 100n">
                            </div>
                            <span class="range-separator">至</span>
                            <div class="filter-field">
                                <label for="search-max">参数最大值</label>
                                <input type="text" id="search-max" placeholder="10k / 1u">
                            </div>
                            <span class="range-hint" id="range-hint">支持 R/K/M、p/n/u 等单位</span>
                        </div>
                    </div>
                    <div class="active-filters" id="active-filters"></div>
                    <div class="toolbar-footer">
                        <div class="result-summary" id="result-summary">正在加载元件…</div>
                        <div class="sort-group" id="sort-selector">
                            <button type="button" class="sort-badge active" data-criteria="led">位置</button>
                            <button type="button" class="sort-badge" data-criteria="parameter">参数</button>
                            <button type="button" class="sort-badge" data-criteria="box">料盒</button>
                            <button type="button" class="sort-badge" data-criteria="key">名称</button>
                        </div>
                        <button type="button" class="dir-toggle" id="dir-toggle-btn"><span id="dir-icon">↑</span><span id="dir-text">正序</span></button>
                    </div>
                    <div class="batch-toolbar" aria-label="批量更新立创内容">
                        <span class="batch-count" id="batch-count">已选 0 项</span>
                        <button type="button" class="btn btn-ghost" id="batch-select-visible">全选筛选结果</button>
                        <button type="button" class="btn btn-ghost" id="batch-clear-selection" disabled>清空选择</button>
                        <button type="button" class="btn btn-green" id="batch-search-lcsc" disabled>搜索所选元件</button>
                        <div class="batch-preview" id="batch-lcsc-preview"></div>
                        <button type="button" class="btn btn-primary" id="batch-apply-lcsc" disabled>更新搜索成功项</button>
                    </div>
                </div>
                <div id="list-container">
                    <ul id="component-list"></ul>
                </div>
            </div>
        </div>

        <!-- ===================== BOM ===================== -->
        <div id="bom-panel" class="page-panel">
            <iframe id="bom-frame" src="about:blank"></iframe>
        </div>
    </main>

    <div id="g-toast"></div>

    <dialog id="repo-dialog">
        <form method="dialog" class="repo-dialog-box" id="repo-dialog-form">
            <h3 id="repo-dialog-title">新建仓库</h3>
            <p id="repo-dialog-subtitle">仓库之间相互独立,搜索/添加/删除只在当前仓库生效。</p>
            <div class="field">
                <label for="repo-dialog-name">仓库名称</label>
                <input type="text" id="repo-dialog-name" maxlength="40" required placeholder="如:螺丝 / 机械零件">
            </div>
            <div class="field">
                <label for="repo-dialog-note">备注 (可选)</label>
                <textarea id="repo-dialog-note" maxlength="200" placeholder="如:螺丝、螺母、轴承" style="min-height:54px;"></textarea>
            </div>
            <div class="repo-dialog-error" id="repo-dialog-error"></div>
            <div class="btn-row">
                <button type="button" class="btn btn-ghost" id="repo-dialog-cancel">取消</button>
                <button type="submit" class="btn btn-primary" id="repo-dialog-submit">创建</button>
            </div>
        </form>
    </dialog>

    <script>
        /* ==================== 全局状态 ==================== */
        const list = document.getElementById('component-list');
        const listContainer = document.getElementById('list-container');
        const form = document.getElementById('add-form');
        const compNameInput = document.getElementById('comp_name');
        const paramInput = document.getElementById('parameter');
        const boxIdInput = document.getElementById('box_id');
        const ledIdInput = document.getElementById('led_id');
        const voltageInput = document.getElementById('voltage');
        const footprintInput = document.getElementById('footprint');
        const noteInput = document.getElementById('note');
        const imageUrlInput = document.getElementById('image_url');
        const componentImagePreview = document.getElementById('component-image-preview');
        const substituteSearchInput = document.getElementById('substitute-search');
        const substituteOptions = document.getElementById('substitute-options');

                allRepos = repos;

        function initResizer(resizerId, targetId, isSidebar) {
            const resizer = document.getElementById(resizerId);

            let startX, startWidth;
            resizer.addEventListener('mousedown', e => {
                startX = e.clientX; startWidth = target.offsetWidth;
                document.body.classList.add('is-resizing'); resizer.classList.add('resizing');
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            });
            function onMove(e) {
                let w = startWidth + (e.clientX - startX);
                if (isSidebar) { w = Math.max(180, Math.min(360, w)); document.documentElement.style.setProperty('--sidebar-width', w + 'px'); }
                else { w = Math.max(320, Math.min(620, w)); target.style.width = w + 'px'; }
            }
            function onUp() {
                document.body.classList.remove('is-resizing'); resizer.classList.remove('resizing');
                document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp);
                localStorage.setItem('rz-' + resizerId, isSidebar
                    ? getComputedStyle(document.documentElement).getPropertyValue('--sidebar-width') : target.style.width);
            }
        }

        function normalizePartNumber(value) {
            return (value ?? '').toString().normalize('NFKC').toUpperCase().replace(/[^A-Z0-9]/g, '');
        }
        function isEquivalentPartNumber(left, right) {
            const a = normalizePartNumber(left), b = normalizePartNumber(right);
            if (!a || !b) return false;
            if (a === b) return true;

            let prefixLength = 0;
            const shorterLength = Math.min(a.length, b.length);
            while (prefixLength < shorterLength && a[prefixLength] === b[prefixLength]) prefixLength++;

            // 数字位发生变化通常代表芯片主型号不同，不能作为包装尾缀忽略。
            if (prefixLength < shorterLength && /\d/.test(a[prefixLength]) && /\d/.test(b[prefixLength])) return false;

            // 至少六位且覆盖较短型号的 2/3，允许末尾多位订购码、包装码不同。
            return prefixLength >= 6 && prefixLength / shorterLength >= 2 / 3;
        }
        function parseElectronicValue(str) {
            if (str == null || str === '') return null;
            let s = str.toString().normalize('NFKC').trim()
                .replace(/µ|μ/g, 'u')
                .replace(/\s+/g, '')
                .replace(/ohms?/gi, 'Ω')
                .replace(/farads?/gi, 'F');

            // 库参数可能带精度等说明，只提取开头带明确单位的主数值，避免从芯片型号中误取数字。
            const valuePrefix = s.match(/^([+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:[rRkKmMgGuUnNpP]\d*)?(?:[ΩFfHhVv])?)(?=$|[±+\-@/,;，；（(])/);
            if (valuePrefix) s = valuePrefix[1];

            // 4k7 / 4R7 / 2u2 等把单位写在小数点位置的常用标法。
            const inline = s.match(/^([+-]?\d+)([rRkKmMgGuUnNpP])(\d+)(?:[ΩFfHhVv])?$/);
            if (inline) {
                const multiplier = unitMultiplier(inline[2]);
                return multiplier == null ? null : parseFloat(`${inline[1]}.${inline[3]}`) * multiplier;
            }

            // 104 / 472 等 EIA 三位电容编码，按 pF 换算。
            if (/^\d{3}$/.test(s)) {
                return parseInt(s.slice(0, 2), 10) * Math.pow(10, parseInt(s[2], 10)) * 1e-12;
            }

            const regular = s.match(/^([+-]?(?:\d+(?:\.\d*)?|\.\d+))([pPnNuUmMkKgGrR]?)(?:[ΩFfHhVv])?$/);
            if (!regular) return null;
            const multiplier = unitMultiplier(regular[2]);
            return multiplier == null ? null : parseFloat(regular[1]) * multiplier;
        }
        function unitMultiplier(unit) {
            const units = {
                '': 1, r: 1, R: 1, p: 1e-12, P: 1e-12, n: 1e-9, N: 1e-9,
                u: 1e-6, U: 1e-6, m: 1e-3, k: 1e3, K: 1e3, M: 1e6, g: 1e9, G: 1e9
            };
            return Object.prototype.hasOwnProperty.call(units, unit) ? units[unit] : null;
        }
        function isElectronicMatch(dataVal, searchVal) {
            if (!searchVal || !searchVal.trim()) return true;
            if (dataVal == null || dataVal === '') return false;
            const a = parseElectronicValue(dataVal), b = parseElectronicValue(searchVal);
            // 能解析成电子数值时采用等值匹配，避免“10k”误中“110k”，
            // 以及 EIA 编码“104”误中型号文本中的 104。
            if (b !== null) {
                if (a === null) return false;
                const mx = Math.max(a, b);
                return mx === 0 ? a === b : Math.abs(a - b) / mx < 0.001;
            }
            return normalizeSearchText(dataVal).includes(normalizeSearchText(searchVal));
        }
        function isResistanceValue(value) {
            const s = (value ?? '').toString().normalize('NFKC').trim();
            // R、Ω、Ohm 都按电阻单位处理；K/M 数值本身也属于常见电阻标法。
            return /(?:\d\s*(?:[rR](?:\d|\b)|[kKmMgG](?:\d|\b)|Ω)|ohms?)/i.test(s);
        }
        function matchesLocationId(value, queryValue) {
            const query = normalizeSearchText(queryValue);
            return !query || normalizeSearchText(value) === query;
        }
        function matchesGlobalQuery(key, d, query) {
            const tokens = normalizeSearchText(query).split(/\s+/).filter(Boolean);
            if (!tokens.length) return true;
            const textFields = [
                key, d.parameter, d.voltage, d.footprint, d.note, d.type,
                d.category, d.brand, d.model, d.out_voltage, d.out_current,
                ...(Array.isArray(d.substitutes) ? d.substitutes : []),
                `box:${d.box_id}`, `pos:${d.led_id}`, `${d.box_id}/${d.led_id}`
            ].map(normalizeSearchText);
            const partNumberFields = [key, d.parameter, d.model];

            return tokens.every(token => {
                const prefix = token.match(/^(box|pos|fp|v):(.+)$/);
                if (prefix) {
                    const [, kind, value] = prefix;
                    if (kind === 'box') return normalizeSearchText(d.box_id) === value;
                    if (kind === 'pos') return normalizeSearchText(d.led_id) === value;
                    if (kind === 'fp') return normalizeSearchText(d.footprint).includes(value);
                    if (kind === 'v') return isElectronicMatch(d.voltage, value);
                }
                if (/^(?:r|ω|Ω|ohms?)$/i.test(token)) return isResistanceValue(d.parameter);
                return textFields.some(field => field.includes(token))
                    || partNumberFields.some(field => isEquivalentPartNumber(field, token))
                    || isElectronicMatch(d.parameter, token)
                    || isElectronicMatch(d.voltage, token);
            });
        }

        /* ==================== 加载 & 渲染列表 ==================== */
        function captureListPosition() {
            const containerRect = listContainer.getBoundingClientRect();
            const cards = [...list.querySelectorAll('.comp-card')];
            const anchor = cards.find(card => card.getBoundingClientRect().bottom > containerRect.top + 1);
            return {
                scrollTop: listContainer.scrollTop,
                anchorKey: anchor ? anchor.dataset.key : null,
                anchorOffset: anchor ? anchor.getBoundingClientRect().top - containerRect.top : 0
            };
        }
        function restoreListPosition(position) {
            if (!position) return;

            // 虚拟列表可能尚未渲染到原锚点，按批次补齐后再恢复视口。
            let anchor = position.anchorKey
                ? list.querySelector(`.comp-card[data-key="${CSS.escape(position.anchorKey)}"]`) : null;
            while (!anchor && renderedComponentCount < filteredComponents.length) {
                renderNextComponentBatch();
                anchor = position.anchorKey
                    ? list.querySelector(`.comp-card[data-key="${CSS.escape(position.anchorKey)}"]`) : null;
            }
            if (anchor) {
                const currentOffset = anchor.getBoundingClientRect().top - listContainer.getBoundingClientRect().top;
                listContainer.scrollTop += currentOffset - position.anchorOffset;
                return;
            }

            // 原锚点若刚好被删除，则退回原滚动像素位置。
            while (listContainer.scrollHeight < position.scrollTop + listContainer.clientHeight
                    && renderedComponentCount < filteredComponents.length) {
                renderNextComponentBatch();
            }
            listContainer.scrollTop = position.scrollTop;
        }
        async function loadComponents({ preserveScroll = false } = {}) {
            const listPosition = preserveScroll ? captureListPosition() : null;
            const requestSeq = ++componentsRequestSeq;
            try {
                const res = await fetch(api('/api/components'));
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (requestSeq !== componentsRequestSeq) return;
                allComponents = data;
                syncBatchSelectionUi();
                // 数据刷新后同步剔除已删除的候选项，并重绘选择器。
                renderSubstitutePicker();
                document.getElementById('stat-count').textContent = Object.keys(allComponents).length;
                applyFilters();
                restoreListPosition(listPosition);
            } catch (error) {
                if (requestSeq !== componentsRequestSeq) return;
                list.innerHTML = '<div class="empty">元件数据加载失败，请刷新页面重试</div>';
                document.getElementById('result-summary').textContent = '加载失败';
                console.error('加载元件失败:', error);
            }
        }
        function applyFilters() {
            let arr = Object.keys(allComponents).map(k => ({ key: k, d: allComponents[k] }));
            const f = searchFilters;
            const has = Object.values(f).some(v => v.trim() !== '');
            const minVal = parseElectronicValue(f.min), maxVal = parseElectronicValue(f.max);
            const minInvalid = f.min.trim() !== '' && minVal === null;
            const maxInvalid = f.max.trim() !== '' && maxVal === null;
            const reversedRange = minVal !== null && maxVal !== null && minVal > maxVal;
            const invalidRange = minInvalid || maxInvalid || reversedRange;
            const rangeHint = document.getElementById('range-hint');
            rangeHint.classList.toggle('error', invalidRange);
            rangeHint.textContent = minInvalid || maxInvalid
                ? '请输入有效数值与单位'
                : reversedRange ? '最小值不能大于最大值' : '支持 R/K/M、p/n/u 等单位';

            if (has && !invalidRange) {
                arr = arr.filter(({ key, d }) => {
                    if (!matchesGlobalQuery(key, d, f.query)) return false;
                    if (!isElectronicMatch(d.parameter, f.parameter)) return false;
                    if (!isElectronicMatch(d.voltage, f.voltage)) return false;
                    if (f.footprint.trim() && !normalizeSearchText(d.footprint).includes(normalizeSearchText(f.footprint))) return false;
                    if (!matchesLocationId(d.box_id, f.box)) return false;
                    if (!matchesLocationId(d.led_id, f.pos)) return false;
                    if (f.note.trim() && !normalizeSearchText(d.note).includes(normalizeSearchText(f.note))) return false;
                    if (minVal !== null || maxVal !== null) {
                        const v = parseElectronicValue(d.parameter);
                        if (v === null) return false;
                        if (minVal !== null && v < minVal) return false;
                        if (maxVal !== null && v > maxVal) return false;
                    }
                    return true;
                });
            } else if (invalidRange) {
                arr = [];
            }

            arr.sort((a, b) => {
                let r = 0;
                switch (currentSortCriteria) {
                    case 'parameter':
                        const av = parseElectronicValue(a.d.parameter), bv = parseElectronicValue(b.d.parameter);
                        if (av === null && bv === null) r = normalizeSearchText(a.d.parameter).localeCompare(normalizeSearchText(b.d.parameter), undefined, { numeric: true });
                        else if (av === null) r = 1;
                        else if (bv === null) r = -1;
                        else r = av - bv;
                        if (r === 0) r = normalizeSearchText(a.d.footprint).localeCompare(normalizeSearchText(b.d.footprint), undefined, { numeric: true });
                        break;
                    case 'box': r = (Number(a.d.box_id) - Number(b.d.box_id)) || (Number(a.d.led_id) - Number(b.d.led_id)); break;
                    case 'led': r = (Number(a.d.led_id) - Number(b.d.led_id)) || (Number(a.d.box_id) - Number(b.d.box_id)); break;
                    case 'key': r = a.key.localeCompare(b.key, undefined, { numeric: true }); break;
                }
                return currentSortDirection === 'asc' ? r : -r;
            });

            syncSearchUi(arr.length);
            filteredComponents = arr;
            renderedComponentCount = 0;
            listContainer.scrollTop = 0;
            list.innerHTML = '';
            if (!arr.length) {
                list.innerHTML = `<div class="empty">${invalidRange ? '请修正参数范围' : '没有匹配的元件，请尝试减少筛选条件'}</div>`;
                return;
            }
            renderNextComponentBatch();
        }
        function renderNextComponentBatch() {
            if (renderedComponentCount >= filteredComponents.length) return;
            const end = Math.min(renderedComponentCount + COMPONENT_BATCH_SIZE, filteredComponents.length);
            const fragment = document.createDocumentFragment();
            for (let i = renderedComponentCount; i < end; i++) {
                const { key, d } = filteredComponents[i];
                fragment.appendChild(renderCard(key, d));
            }
            list.appendChild(fragment);
            renderedComponentCount = end;
        }
        function syncSearchUi(resultCount = null) {
            const total = Object.keys(allComponents).length;
            const activeEntries = Object.entries(searchFilters).filter(([, value]) => value.trim() !== '');
            const advancedCount = activeEntries.filter(([field]) => field !== 'query').length;
            const queryWrap = document.getElementById('global-search-wrap');
            queryWrap.classList.toggle('has-value', searchFilters.query.trim() !== '');
            const countBadge = document.getElementById('filter-count');
            countBadge.textContent = advancedCount ? advancedCount.toString() : '';
            countBadge.dataset.count = advancedCount.toString();
            document.getElementById('filter-toggle').classList.toggle('active', advancedCount > 0);
            document.getElementById('clear-search-btn').disabled = activeEntries.length === 0;
            document.getElementById('result-summary').innerHTML = resultCount == null
                ? '正在筛选…'
                : `显示 <b>${resultCount}</b> / ${total} 个元件`;

            const chipWrap = document.getElementById('active-filters');
            chipWrap.innerHTML = '';
            for (const [field, value] of activeEntries) {
                const chip = document.createElement('button');
                chip.type = 'button';
                chip.className = 'active-filter';
                chip.dataset.filter = field;
                chip.title = `清除${searchFilterLabels[field]}`;
                chip.textContent = `${searchFilterLabels[field]}：${value} ×`;
                chipWrap.appendChild(chip);
            }
        }
        listContainer.addEventListener('scroll', () => {
            const remaining = listContainer.scrollHeight - listContainer.scrollTop - listContainer.clientHeight;
            if (remaining < 700) renderNextComponentBatch();
        }, { passive: true });

        function renderCard(key, d) {
            const li = document.createElement('li');
            li.className = `comp-card${batchSelectedComponents.has(key) ? ' batch-selected' : ''}`;
            li.dataset.key = key;

            let badges = '';
            if (d.type && d.type !== 'N/A') badges += `<span class="badge type">🏷️ ${d.type}</span>`;
            if (d.voltage && d.voltage.trim()) badges += `<span class="badge volt">⚡ ${d.voltage}</span>`;
            if (d.out_voltage && d.out_voltage !== 'N/A') badges += `<span class="badge volt">🔌 ${d.out_voltage}</span>`;
            if (d.out_current && d.out_current !== 'N/A') badges += `<span class="badge cur">🔋 ${d.out_current}</span>`;
            if (d.category && d.category !== 'N/A') badges += `<span class="badge cat">📂 ${d.category}</span>`;

            const note = (d.note && d.note.trim())
                ? `<div class="comp-note collapsed" data-note>${escapeHtml(d.note)}</div>` : '';
            const image = safeImageUrl(d.image);
            const substitutes = Array.isArray(d.substitutes)
                ? d.substitutes.filter(name => name in allComponents) : [];
            const substituteHtml = substitutes.length
                ? `<div class="comp-substitutes"><span>替换料</span>${substitutes.map(name =>
                    `<span class="comp-substitute">${escapeHtml(allComponents[name]?.parameter || name)} · ${escapeHtml(name)}</span>`
                ).join('')}</div>` : '';

            li.innerHTML = `
                <div class="comp-top">
                    <div class="comp-main">
                        ${image ? `<img class="comp-image" src="${escapeHtml(image)}" alt="${escapeHtml(d.parameter || key)}" loading="lazy" onerror="this.style.display='none'">` : ''}
                        <div>
                            <div class="comp-title">${escapeHtml(d.parameter || '—')} <span class="fp">· ${escapeHtml(d.footprint || '')}</span></div>
                            <div class="comp-id">${escapeHtml(key)}</div>
                        </div>
                    </div>
                    <div class="comp-actions">
                        <input type="checkbox" class="batch-checkbox" data-batch-select
                            aria-label="选择 ${escapeHtml(d.parameter || key)}" ${batchSelectedComponents.has(key) ? 'checked' : ''}>
                        <button class="icon-btn swap" data-swap title="与其他元件交换位置">⇄</button>
                        <button class="icon-btn del" data-del title="删除">✕</button>
                    </div>
                </div>
                <div class="comp-loc">
                    <div class="loc-box"><span class="lbl">BOX</span><input type="number" data-edit="box" value="${d.box_id}"></div>
                    <div class="loc-box"><span class="lbl">POS</span><input type="number" data-edit="led" value="${d.led_id}"></div>
                </div>
                ${badges ? `<div class="badges">${badges}</div>` : ''}
                ${substituteHtml}
                ${note}
            `;
            return li;
        }
        function escapeHtml(s) {
            return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        }

        /* ==================== 快速编辑 Box/Pos ==================== */
        list.addEventListener('change', async e => {

            if (batchCheckbox) {
                const card = batchCheckbox.closest('.comp-card');

            const r = await fetch(api('/api/update'), {
                method: 'POST', headers: { 'Content-Type': 'application/json' },

            }).then(r => r.json());

        /* ==================== 卡片点击（填表 / 删除 / 交换 / 备注） ==================== */
        list.addEventListener('click', async e => {
            const card = e.target.closest('.comp-card');
            if (!card) return;
            const key = card.dataset.key;

            if (e.target.closest('[data-del]')) {
                if (!confirm(`确定删除元件 "${key}" 吗？`)) return;
                const r = await fetch(api('/api/delete'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ component_name: key }) }).then(r => r.json());
                if (r.success) { await loadComponents({ preserveScroll: true }); findNextLedId(false); } else alert('删除失败: ' + r.error);
                return;
            }
            if (e.target.closest('[data-swap]')) {
                const btn = e.target.closest('[data-swap]');
                if (!swapPendingKey) { swapPendingKey = key; btn.classList.add('pending'); btn.textContent = '…'; }
                else if (swapPendingKey === key) { swapPendingKey = null; btn.classList.remove('pending'); btn.textContent = '⇄'; }
                else {
                    const n1 = swapPendingKey, n2 = key;
                    if (confirm(`交换 "${n1}" 与 "${n2}" 的位置？`)) {
                        const r = await fetch(api('/api/swap_components'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name1: n1, name2: n2 }) }).then(r => r.json());
                        if (!r.success) alert('交换失败: ' + r.error);
                    }
                    swapPendingKey = null; await loadComponents({ preserveScroll: true });

                return;

            if (e.target.closest('[data-edit]')) return;
            if (e.target.closest('[data-batch-select]')) return;

            selectedParamUnit = '';

            voltageInput.value = d.voltage || '';
            footprintInput.value = d.footprint || '';
            noteInput.value = d.note || '';
            updateComponentImage(d.image || '');
            selectedSubstitutes = new Set(Array.isArray(d.substitutes) ? d.substitutes : []);
            substituteSearchInput.value = '';
            renderSubstitutePicker();
            window._lastFetchedData = null;
            document.getElementById('lcsc-result').style.display = 'none';
            card.classList.add('flash'); setTimeout(() => card.classList.remove('flash'), 1200);
        });

        /* ==================== 自动下一个 pos ==================== */
        let lastAutoBoxId = null;
        function findNextLedId(force) {
            const box = parseInt(boxIdInput.value);
            if (isNaN(box)) return;
            if (!force && box === lastAutoBoxId && ledIdInput.value !== '') return;
            let max = 0;
            for (const d of Object.values(allComponents)) if (d.box_id === box && d.led_id > max) max = d.led_id;
            ledIdInput.value = max + 1; lastAutoBoxId = box;
        }
        boxIdInput.addEventListener('input', () => findNextLedId(false));

        /* ==================== 添加 ==================== */
        function collectDetails(existing) {
            const fetched = window._lastFetchedData || {};
            // 只要本次立创搜索成功，添加和更新都以原厂型号作为参数名。
            // 这里在提交前再次取 product_name，避免用户误改输入框或界面未及时刷新。
            const searchedProductName = String(fetched.product_name || '').trim();
            return {
                box_id: parseInt(boxIdInput.value),
                led_id: parseInt(ledIdInput.value),
                parameter: searchedProductName || (paramInput.value + selectedParamUnit).trim(),
                voltage: voltageInput.value,
                footprint: footprintInput.value,
                note: noteInput.value.trim(),
                type: fetched.功能类型 || (existing && existing.type) || 'N/A',
                work_voltage: fetched.工作电压 || (existing && existing.work_voltage) || 'N/A',
                out_voltage: fetched.输出电压 || (existing && existing.out_voltage) || 'N/A',
                out_current: fetched.输出电流 || (existing && existing.out_current) || 'N/A',
                category: fetched.类目 || (existing && existing.category) || 'N/A',
                image: imageUrlInput.value.trim(),
                lcsc_code: fetched.lcsc_code || (existing && existing.lcsc_code) || '',
                product_url: fetched.product_url || (existing && existing.product_url) || '',
                datasheet: fetched.datasheet || (existing && existing.datasheet) || '',
                brand: fetched.brand || (existing && existing.brand) || '',
                product_name: searchedProductName || (existing && existing.product_name) || '',
                substitutes: [...selectedSubstitutes]
            };
        }
        form.addEventListener('submit', async e => {
            e.preventDefault();
            // 原厂型号属于 parameter；元件唯一 ID 仍沿用表单值或随机生成。
            const name = compNameInput.value.trim() || generateRandomID();
            const details = collectDetails();
            const dup = Object.entries(allComponents).filter(([, c]) =>
                (c.parameter || '').toLowerCase() === details.parameter.toLowerCase() &&
                (c.voltage || '').toLowerCase() === (details.voltage || '').toLowerCase() &&
                (c.footprint || '').toLowerCase() === details.footprint.toLowerCase());
            if (dup.length) {
                let msg = '⚠️ 已存在相同元件:\n\n';
                dup.forEach(([k, c]) => { msg += `📦 ${c.parameter} | ${c.footprint}${c.voltage ? ' | ' + c.voltage : ''}\n   Box ${c.box_id}, Pos ${c.led_id} · ${k}\n\n`; });
                if (!confirm(msg + '仍要继续添加？')) return;
            }
            const r = await fetch(api('/api/add'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ component_name: name, details }) }).then(r => r.json());
            if (r.success) {
                const box = details.box_id, fp = details.footprint;
                form.reset();
                boxIdInput.value = box; footprintInput.value = fp;
                compNameInput.value = generateRandomID();
                document.querySelectorAll('.chip-btn.selected').forEach(b => b.classList.remove('selected'));
                selectedParamUnit = ''; window._lastFetchedData = null; lastAutoBoxId = box;
                selectedSubstitutes.clear(); substituteSearchInput.value = ''; updateComponentImage(''); renderSubstitutePicker();
                document.getElementById('lcsc-result').style.display = 'none';
                await loadComponents({ preserveScroll: true }); findNextLedId(true);
            } else {
                alert('添加失败: ' + r.error);
                if (r.error.includes('已存在')) compNameInput.value = generateRandomID();
            }
        });

        /* ==================== 更新 ==================== */
        document.getElementById('update-btn').addEventListener('click', async () => {
            const name = compNameInput.value.trim();
            if (!name) return alert('请先选择或输入要更新的元件名称');
            if (!allComponents[name]) return alert(`元件库中不存在 "${name}"，请先添加或从右侧选择。`);
            if (!confirm(`用当前表单内容更新 "${name}" 吗？`)) return;
            const details = collectDetails(allComponents[name]);
            const r = await fetch(api('/api/update'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ component_name: name, details }) }).then(r => r.json());
            if (r.success) await loadComponents({ preserveScroll: true }); else alert('更新失败: ' + r.error);

        /* ==================== 快捷按钮 ==================== */
        document.querySelectorAll('.chip-btn[data-unit]').forEach(btn => btn.addEventListener('click', () => {

        document.getElementById('sort-selector').addEventListener('click', e => {

            if (!b) return;

        function scheduleFilter() {

            syncSearchUi();

        function setFilterValue(field, value, shouldApply = true) {
            searchFilters[field] = value;

        document.getElementById('filter-toggle').addEventListener('click', () => {

            const target = e.target;
